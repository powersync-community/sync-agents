<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' http://localhost:8097; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: file: thumbnail:; connect-src 'self' https: http://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:* ws://127.0.0.1:* wss://127.0.0.1:* wss:; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'self' file:;">
  <title>Sync Agents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <script>
    // React DevTools - only in development (when running via Vite dev server)
    if (location.protocol === 'file:' || location.hostname === 'localhost') {
      const s = document.createElement('script');
      s.src = 'http://localhost:8097';
      document.head.appendChild(s);
    }
  </script>
  <div id="root">
    <!-- Initial loading state: visible until React mounts and replaces #root contents.
         Prevents blank screen on cold start / post-update launch when code cache is stale. -->
    <style>
      #_loader { display:flex; align-items:center; justify-content:center; height:100vh; opacity:0; animation:_fade 0.4s 0.3s forwards; }
      #_loader img { width:52px; height:52px; object-fit:contain; animation:_pulse 1.2s ease-in-out infinite; }
      @keyframes _fade { to { opacity:1 } }
      @keyframes _pulse {
        0%, 100% { opacity:0.72; transform:scale(0.96); }
        50% { opacity:1; transform:scale(1); }
      }
    </style>
    <div id="_loader"><img src="./assets/powersync-logo-icon.png" alt="PowerSync loading"></div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
