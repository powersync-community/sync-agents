services:
  powersync:
    image: journeyapps/powersync-service:latest
    container_name: powersync_syncagents
    restart: unless-stopped
    env_file:
      - .env.supabase-mongo
    volumes:
      - ./powersync.yaml:/app/powersync.yaml:ro
    ports:
      - ${PS_PORT}:${PS_PORT}
      - ${PS_TELEMETRY_PORT}:${PS_TELEMETRY_PORT}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
      - supabase_network_syncagents

  mongo:
    image: mongo:7.0
    container_name: powersync_syncagents_mongo
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - powersync_mongo_storage:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  powersync_mongo_storage:

networks:
  supabase_network_syncagents:
    external: true
