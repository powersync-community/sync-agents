# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

port: !env PS_PORT

replication:
  connections:
    - type: !env PS_DATA_SOURCE_TYPE
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: !env PS_SYNC_BUCKET_TYPE
  uri: !env PS_SYNC_BUCKET_URI
  sslmode: disable

sync_config:
  file: ./sync-config.yaml

client_auth:
  jwks_uri: !env PS_BACKEND_JWKS_URI
  jwks:
    keys:
      - kty: 'oct'
        k: !env PS_HS256_KEY
        alg: 'HS256'
  audience: ["authenticated", "powersync", "powersync-dev"]

api:
  tokens:
    - !env PS_API_TOKEN

telemetry:
  disable_telemetry_sharing: true
  prometheus_port: !env PS_TELEMETRY_PORT
